# Global settings, based on the upstream sample config:
# See: https://github.com/rodriguezst/rEFInd-nabu/blob/main/refind.conf-sample

banner_scale fillscreen
hideui safemode,singleuser,hwtest,hints,editor,badges
rotation 3
scan_all_linux_kernels false
screensaver 30
showtools reboot, shutdown
timeout 5
use_graphics_for linux
use_nvram false

# Theme settings, from bobafetthotmail/refind-theme-regular
# (packaged under packages/refind-theme-regular in this repo)
big_icon_size 256
small_icon_size 96
banner icons/256-96/bg_dark.png
font fonts/source-code-pro-extralight-32.png
icons_dir icons/256-96
selection_big icons/256-96/selection_dark-big.png
selection_small icons/256-96/selection_dark-small.png
